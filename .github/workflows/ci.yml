name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://value:value@localhost:5432/value_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # La aplicación debe usar un rol sin superusuario ni BYPASSRLS para que se aplique Row Level Security.
      - name: Crear rol y base de datos de la aplicación
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE value LOGIN PASSWORD 'value' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE value_test OWNER value"
      - name: xmllint para validar el XML contra el XSD de la AEAT
        run: xmllint --version || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://value:value@localhost:5432/value_test
